<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimeCross Finder AI</title>
<style>
:root{color-scheme:dark;--bg:#070712;--p:#111125;--p2:#171733;--t:#f7f7ff;--m:#9d9db8;--a:#9b5cff;--b:#ff4fd8;--l:#29294a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#27134a,#0b0b19 42%,var(--bg) 72%);color:var(--t);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.badge{font-size:12px;color:#d9c8ff;border:1px solid #3b2b62;padding:6px 9px;border-radius:999px;background:#151027}
.hero{text-align:center;padding:70px 0 35px}.hero h1{font-size:clamp(38px,8vw,72px);line-height:.98;margin:0 0 15px;letter-spacing:-3px}.grad{background:linear-gradient(90deg,#fff,#bda0ff,#ff83e7);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:650px;margin:0 auto 25px;color:var(--m)}
.search{max-width:720px;margin:auto;display:flex;gap:8px;background:#101021;border:1px solid #38385c;border-radius:18px;padding:8px}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;font-size:16px;padding:12px}.search button,.watch{border:0;border-radius:13px;padding:12px 18px;background:linear-gradient(135deg,var(--a),var(--b));color:white;font-weight:800;cursor:pointer}.search button:disabled{opacity:.55}
.status{text-align:center;color:var(--m);min-height:24px;margin:18px 0}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{background:linear-gradient(180deg,#15152d,#0f0f20);border:1px solid var(--l);border-radius:18px;padding:18px}.provider{font-weight:800;font-size:18px}.title{color:#ddd;margin:6px 0 12px}.meta{font-size:12px;color:#aaa;line-height:1.5;margin-bottom:14px}.empty{text-align:center;color:var(--m);padding:35px;border:1px dashed #303052;border-radius:18px}.error{color:#ff9a9a}.foot{text-align:center;color:#777;font-size:12px;margin-top:35px}
@media(max-width:560px){.hero{padding-top:45px}.hero h1{letter-spacing:-2px}.search button{padding:11px 14px}}
</style></head><body>
<div class="wrap">
<div class="top"><div class="brand">✦ AnimeCross Finder</div><div class="badge">AI Web Search</div></div>
<section class="hero"><h1><span class="grad">Find where anime</span><br>is actually watchable.</h1>
<p>Search an anime and let AnimeCross AI research current legal streaming pages for India.</p>
<form class="search" id="searchForm"><input id="query" autocomplete="off" placeholder="Search any anime…" aria-label="Anime title"><button id="searchBtn" type="submit">Search</button></form></section>
<div class="status" id="status"></div><section id="results"></section>
<div class="foot">AnimeCross Finder AI · Streaming rights can change.</div></div>
<script>
const WORKER_URL="https://animecross-aimoke-4e76.scripttopinrock.workers.dev";
const form=document.getElementById("searchForm"),input=document.getElementById("query"),btn=document.getElementById("searchBtn"),statusEl=document.getElementById("status"),results=document.getElementById("results");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(data){const sources=Array.isArray(data?.sources)?data.sources:[];if(!sources.length){results.innerHTML='<div class="empty">No confidently verified watch pages were found for this title.</div>';return}
results.innerHTML='<div class="results">'+sources.map(s=>'<article class="card"><div class="provider">'+esc(s.provider||"Streaming service")+'</div><div class="title">'+esc(s.title||data.title||"")+'</div><div class="meta">'+esc(s.access||"availability")+(s.note?" · "+esc(s.note):"")+'</div><button class="watch" data-url="'+esc(s.url)+'">Watch Anime →</button></article>').join("")+"</div>";
document.querySelectorAll(".watch").forEach(b=>b.addEventListener("click",()=>{const u=b.dataset.url;if(/^https:\/\//i.test(u))window.open(u,"_blank","noopener,noreferrer")}));}
form.addEventListener("submit",async e=>{e.preventDefault();const anime=input.value.trim();if(!anime)return;btn.disabled=true;statusEl.textContent="AI is researching the web…";results.innerHTML="";
try{const r=await fetch(WORKER_URL+"/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({anime,country:"India"})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Worker request failed");statusEl.textContent="Results for “"+(d.title||anime)+"”";render(d)}
catch(err){statusEl.innerHTML='<span class="error">Search failed: '+esc(err.message||"Unknown error")+"</span>"}finally{btn.disabled=false}});
</script></body></html>
