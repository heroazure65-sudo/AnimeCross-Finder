<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070914"><title>AnimeCross Finder</title>
<style>
:root{color-scheme:dark;--bg:#070914;--panel:#0e1222;--line:#252b47;--text:#f5f7ff;--muted:#9ca6c7;--cyan:#65e6ff;--violet:#9b7bff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#182047,#070914 46%);color:var(--text);font-family:Inter,system-ui,sans-serif}
main{width:min(900px,calc(100% - 28px));margin:auto;padding:48px 0 70px}.hero{text-align:center;margin-bottom:28px}
.logo{font-size:clamp(34px,8vw,64px);font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,var(--cyan),#fff,var(--violet));-webkit-background-clip:text;color:transparent}
.tag{color:var(--muted);margin-top:8px}.search{display:flex;gap:10px;background:#0e1222e8;border:1px solid var(--line);border-radius:18px;padding:8px}
input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:17px;padding:14px}
button{border:0;border-radius:13px;background:linear-gradient(135deg,#53dcff,#8d72ff);color:#07101d;font-weight:800;padding:0 20px;min-height:50px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.status{text-align:center;color:var(--muted);min-height:30px;padding:18px 0}.grid{display:grid;gap:14px}
.card{background:linear-gradient(145deg,#12172cf2,#0a0d1bf2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.provider{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);font-weight:800}.title{font-size:20px;font-weight:800;margin:5px 0}.meta{color:var(--muted);font-size:13px}.watch{white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:35px 10px;border:1px dashed var(--line);border-radius:18px}
.overlay{position:fixed;inset:0;background:#03040bd9;backdrop-filter:blur(12px);display:none;place-items:center;z-index:10}.overlay.show{display:grid}
.transition{width:min(900px,92vw);height:min(700px,86vh);border:1px solid #31395e;border-radius:24px;overflow:hidden;position:relative;background:#050713}
video{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(#05071333,#050713aa)}
.count{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.num{font-size:clamp(90px,22vw,180px);font-weight:900;text-shadow:0 0 35px #65e6ff88}.small{font-weight:700;color:#dce5ff;letter-spacing:2px}
.cancel{position:absolute;right:14px;top:14px;background:#12182b;color:#fff;border:1px solid #31395e;z-index:2}
@media(max-width:620px){main{padding-top:30px}.search{flex-direction:column}.search button{width:100%}.card{align-items:flex-start;flex-direction:column}.watch{width:100%}.watch button{width:100%}}
</style>
</head>
<body>
<main>
<section class="hero"><div class="logo">AnimeCross</div><div class="tag">Find verified official places to watch anime.</div></section>
<form class="search" id="searchForm"><input id="animeInput" autocomplete="off" spellcheck="false" placeholder="Search an anime..." aria-label="Anime title"><button id="searchBtn" type="submit">SEARCH</button></form>
<div class="status" id="status"></div><section class="grid" id="results"></section>
</main>
<div class="overlay" id="overlay" aria-hidden="true"><div class="transition">
<button class="cancel" id="cancelBtn" type="button">CANCEL</button>
<video id="transitionVideo" muted playsinline preload="auto"><source src="assets/watch-transition.mp4" type="video/mp4"></video>
<div class="shade"></div><div class="count"><div><div class="num" id="countNum">6</div><div class="small">PREPARING YOUR WATCH PAGE</div></div></div>
</div></div>
<script>
const WORKER_URL="https://animecross-aimoke-4e76.scripttopinrock.workers.dev";
const form=document.getElementById("searchForm"),input=document.getElementById("animeInput"),button=document.getElementById("searchBtn");
const status=document.getElementById("status"),results=document.getElementById("results"),overlay=document.getElementById("overlay");
const video=document.getElementById("transitionVideo"),countNum=document.getElementById("countNum"),cancelBtn=document.getElementById("cancelBtn");
let timer=null,cancelled=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function render(data){results.innerHTML="";if(!data.sources?.length){results.innerHTML='<div class="empty">No confidently verified official watch pages were found.</div>';return}
for(const s of data.sources){const card=document.createElement("article");card.className="card";card.innerHTML=`<div><div class="provider">${esc(s.provider)}</div><div class="title">${esc(s.title||data.title)}</div><div class="meta">${esc(s.access)} · ${esc(s.confidence)} confidence</div></div><div class="watch"><button type="button">▶ WATCH NOW</button></div>`;card.querySelector("button").onclick=()=>startWatch(s.url);results.appendChild(card)}}
async function search(anime){button.disabled=true;status.textContent="Researching official watch pages…";results.innerHTML="";
try{const r=await fetch(WORKER_URL+"/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({anime,country:"India"})});const d=await r.json();if(!r.ok)throw Error(d.error||"Search failed");status.textContent=d.cached?"Instant result from cache.":"Search complete.";render(d)}catch(e){status.textContent="Search error: "+e.message}finally{button.disabled=false}}
function sound(){const a=new Audio("assets/mixkit-shot-light-energy-flowing-2589.wav");a.volume=.45;a.play().catch(()=>{})}
function startWatch(url){if(!/^https:\/\//i.test(url))return;sound();cancelled=false;overlay.classList.add("show");overlay.setAttribute("aria-hidden","false");video.currentTime=0;video.play().catch(()=>{});const start=performance.now();clearInterval(timer);timer=setInterval(()=>{if(cancelled){clearInterval(timer);return}const e=(performance.now()-start)/1000;const n=Math.max(0,6-Math.floor(e));countNum.textContent=n||"GO!";if(e>=6){clearInterval(timer);location.href=url}},100)}
cancelBtn.onclick=()=>{cancelled=true;clearInterval(timer);video.pause();overlay.classList.remove("show");overlay.setAttribute("aria-hidden","true")};
form.onsubmit=e=>{e.preventDefault();const v=input.value.trim();if(v)search(v)};
</script>
</body>
</html>
